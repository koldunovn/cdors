[workspace]
resolver = "2"
members = ["crates/cdors-core", "crates/cdors"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "BSD-3-Clause"

[workspace.dependencies]
cdors-core = { path = "crates/cdors-core" }

# Zarr: filesystem store is a default feature; remote access goes through
# zarrs_object_store + object_store (http, aws). `async` enables zarrs' async array API
# for those stores; zlib/fletcher32 cover numcodecs zlib and HDF5-style checksums.
zarrs = { version = "0.23.14", features = ["async", "zlib", "fletcher32"] }
zarrs_object_store = { version = "0.7.0", features = ["http", "aws"] }
object_store = { version = "0.14.2", default-features = false, features = ["http", "aws"] }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
rayon = "1.12"
crossbeam-channel = "0.5"

# NetCDF / HDF5 via the system (spack) netCDF-C and its HDF5; see env.sh.
netcdf = "0.12.1"
hdf5-metno = "0.15.0"
# Only for its `LOCK`, the one HDF5 lock that hdf5-metno and netcdf-sys already share.
hdf5-metno-sys = "0.12.4"

cdshealpix = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
glob = "0.3.4"

# Task 10 readers: kerchunk Parquet references (zstd pages only, no Arrow), inline base64 refs,
# direct inflate of NetCDF-4 chunks.
parquet = { version = "60.0.0", default-features = false, features = ["zstd"] }
base64 = "0.22.1"
flate2 = "1.1.10"
# c-blosc for the HDF5 blosc filter (32001); the same build zarrs' `blosc` feature already links.
blosc-src = { version = "0.3.8", features = ["lz4", "zlib", "zstd", "snappy"] }

[profile.release]
debug = "line-tables-only"
